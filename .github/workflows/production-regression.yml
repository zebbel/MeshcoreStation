name: Production regression
on:
  push:
    branches: [main, v4.0.0, release-3.0.5-integration]
  pull_request:
    paths:
      - 'meshcorestation/**'
      - 'tests/**'
      - '.github/workflows/production-regression.yml'
      - 'requirements.txt'
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom
      - name: Complete browser regression suite
        run: |
          for file in tests/*.cjs; do node "$file"; done
