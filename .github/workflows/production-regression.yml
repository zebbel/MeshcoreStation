name: Production regression
on:
  push:
    branches: [main, v4.0.0, release-3.0.5-integration]
  pull_request:
    paths:
      - 'meshcorestation/**'
      - 'tests/**'
      - '.github/workflows/production-regression.yml'
      - 'requirements.txt'
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Select affected release checks
        id: scope
        run: python -m scripts.v4_test_scope >> "$GITHUB_OUTPUT"
      - name: Python regression checks
        run: |
          if [ "${{ steps.scope.outputs.performance_calc }}" = "true" ]; then
            python -m pytest -q tests/test_performance_dashboard.py tests/test_performance.py
          elif [ "${{ steps.scope.outputs.neighbor_map }}" = "true" ]; then
            python -m pytest -q tests/test_performance_neighbor_map.py tests/test_performance.py tests/test_layout_panels.py tests/test_updater.py tests/test_optimizer.py
          else
            python -m pytest -q
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom
      - name: UI regression checks
        run: |
          if [ "${{ steps.scope.outputs.performance_calc }}" = "true" ]; then
            node tests/test_performance_ui.cjs
          elif [ "${{ steps.scope.outputs.neighbor_map }}" = "true" ]; then
            node tests/test_network_relationships_ui.cjs
            node tests/test_performance_neighbor_map_ui.cjs
            node tests/test_performance_ui.cjs
            node tests/test_dashboard_footer.cjs
            node tests/test_updates_ui.cjs
            node tests/test_update_autoreload.cjs
            node tests/test_optimizer_ui.cjs
          else
            for file in tests/*.cjs; do node "$file" || exit 1; done
          fi
