name: Repeater backend
on:
  push:
    branches: [main, layout-preview, release-3.0.5-integration]
  pull_request:
    paths:
      - 'meshcorestation/storage/**'
      - 'meshcorestation/radio/voltage_monitor.py'
      - 'meshcorestation/web/voltage_api.py'
      - 'meshcorestation/web/passive_api.py'
      - 'tests/test_multi_repeater.py'
      - 'tests/test_voltage_destinations.py'
      - '.github/workflows/repeater-backend.yml'
jobs:
  repeater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_multi_repeater.py tests/test_voltage_destinations.py tests/test_passive_statistics.py -q
