name: Repeater Optimizer checks
on:
  push:
    branches: [feature/repeater-optimization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile all Python modules
        run: python -m compileall -q meshcorestation tests
      - name: Optimizer and repeater regression tests
        run: python -m pytest -q tests/test_optimizer.py tests/test_advisor.py tests/test_advisor_evaluation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser test dependencies
        run: npm install --no-save --ignore-scripts jsdom@26
      - name: Repeater UI tests
        run: |
          node tests/test_repeater_management_ui.cjs
          node tests/test_advisor_bridge_ui.cjs
          node tests/test_optimizer_ui.cjs
