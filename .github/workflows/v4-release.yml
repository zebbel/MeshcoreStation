name: V4 branch release
on:
  push:
    branches: [v4.0.0]
    paths:
      - meshcorestation/__init__.py
      - .github/workflows/v4-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-branch-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/v4.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom playwright@1.56.1
      - name: Complete UI regression
        run: |
          for file in tests/*.cjs; do node "$file" || exit 1; done
      - run: npx playwright install --with-deps chromium
      - name: Real browser map and responsive layout regression
        run: |
          PYTHONPATH=. python tests/browser/serve.py > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8050/ > /dev/null && break; sleep 1; done
          node tests/browser/network_monitoring.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-browser-verification
          path: |
            browser-results/
            browser-server.log
          retention-days: 14
      - run: python -m scripts.check_install
      - name: Verify release version
        run: python -c 'from meshcorestation import __version__; assert __version__ == "4.0.4"'
  publish:
    if: ${{ false }} # Hold publication until direction/confidence screenshots are reviewed.
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish dedicated V4 prerelease without changing main or latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.0.4 --target "$GITHUB_SHA" --title "MeshcoreStation 4.0.4 — V4 branch" --notes-file docs/v4-release.md --prerelease --latest=false
